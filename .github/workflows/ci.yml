name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,qc-assist]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=src/gb_dicom2bids --cov-report=term-missing
      - name: CLI smoke test
        run: |
          gb-dicom2bids --version
          gb-dicom2bids --help
          gb-dicom2bids convert --help
          gb-dicom2bids status --help
          python qc_viewer.py --help
          python qc_assist.py --help
      - name: Shell syntax
        run: bash -n scripts/start_run.sh scripts/stop_run.sh
      - name: Build
        run: python -m build
      - name: Public release gate
        run: python scripts/check_public_release.py .
