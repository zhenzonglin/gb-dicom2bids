name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=src/gb_dicom2bids --cov-report=term-missing
      - name: Build
        run: python -m build
      - name: Public release gate
        run: python scripts/check_public_release.py .
